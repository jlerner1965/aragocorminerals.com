<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/aragocor-minerals-design-system-6cd5605f-b1a2-4c76-af9e-ea4efe576a33/colors_and_type.css">
<script src="_ds/aragocor-minerals-design-system-6cd5605f-b1a2-4c76-af9e-ea4efe576a33/_ds_bundle.js"></script>
<style>:root{--ink:#0E3540;--tide:#526A70;--shore:#7C97A0;--sand:#D7C59C;--bone:#F7F4ED;--paper:#FFFFFF;--root:#49613C;--leaf:#49613C;--fg-1:#0E3540;--fg-2:#526A70;--fg-3:#8A9AA0;--border:#C7CBC6;--border-strong:#A9B0AC;--ink-04:rgba(14,53,64,0.04);--ink-08:rgba(14,53,64,0.08);--ink-12:rgba(14,53,64,0.12);--ink-20:rgba(14,53,64,0.20);--ink-40:rgba(14,53,64,0.40);--ink-60:rgba(14,53,64,0.60);--ink-80:rgba(14,53,64,0.80);}</style>
<style>
  @keyframes menuIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .navlink { transition: color 220ms var(--ease-tide); }
  .navlink:hover { color: var(--bone) !important; }
  .dd-link:hover { background: var(--sand); }
  .btn-ink:hover { background: var(--sand) !important; }
</style>
</helmet>
<div style="position: sticky; top: 0; z-index: 50; background: #0d141c; border-bottom: 1px solid rgba(247,244,237,0.14); font-family: var(--font-sans);">
  <div style="max-width: 1440px; margin: 0 auto; height: 74px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 36px;" onMouseLeave="{{ leaveNav }}">
      <a href="index.html" style="display: flex; align-items: center; border-bottom: none; flex-shrink: 0;"><img src="assets/aragocor-logo.png" alt="Aragocor Minerals" style="height: 42px; display: block;"></a>
      <div style="display: flex; align-items: center; gap: 22px;">

        <div style="position: relative;" onMouseEnter="{{ leaveNav }}">
          <a href="products.html" class="navlink" style="color: rgba(247,244,237,0.85); font-size: 14.5px; font-weight: 500; padding: 8px 0; border-bottom: none; display: inline-block;">Products</a>
          <sc-if value="{{ aProducts }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px; background: var(--bone);"></div></sc-if>
        </div>

        <div style="position: relative;" onMouseEnter="{{ leaveNav }}">
          <a href="industries.html" class="navlink" style="color: rgba(247,244,237,0.85); font-size: 14.5px; font-weight: 500; padding: 8px 0; border-bottom: none; display: inline-block;">Industries</a>
          <sc-if value="{{ aIndustries }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px; background: var(--bone);"></div></sc-if>
        </div>

        <div style="position: relative;" onMouseEnter="{{ leaveNav }}">
          <a href="sustainability.html" class="navlink" style="color: rgba(247,244,237,0.85); font-size: 14.5px; font-weight: 500; padding: 8px 0; border-bottom: none; display: inline-block;">Sustainability</a>
          <sc-if value="{{ aSustain }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px; background: var(--bone);"></div></sc-if>
        </div>

        <div style="position: relative;" onMouseEnter="{{ leaveNav }}">
          <a href="resources.html" class="navlink" style="color: rgba(247,244,237,0.85); font-size: 14.5px; font-weight: 500; padding: 8px 0; border-bottom: none; display: inline-block;">Resources</a>
          <sc-if value="{{ aResources }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px; background: var(--bone);"></div></sc-if>
        </div>

        <div style="position: relative;" onMouseEnter="{{ leaveNav }}">
          <a href="about.html" class="navlink" style="color: rgba(247,244,237,0.85); font-size: 14.5px; font-weight: 500; padding: 8px 0; border-bottom: none; display: inline-block;">About</a>
          <sc-if value="{{ aAbout }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px; background: var(--bone);"></div></sc-if>
        </div>

        <div style="position: relative;" onMouseEnter="{{ leaveNav }}">
          <a href="contact.html" class="navlink" style="color: rgba(247,244,237,0.85); font-size: 14.5px; font-weight: 500; padding: 8px 0; border-bottom: none; display: inline-block;">Contact</a>
          <sc-if value="{{ aContact }}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; bottom: -1px; width: 100%; height: 2px; background: var(--bone);"></div></sc-if>
        </div>
      </div>
    </div>
    <a href="contact.html" class="btn-ink" style="background: var(--bone); color: var(--ink); height: 44px; padding: 0 20px; border-radius: 4px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; border: none; border-bottom: none; white-space: nowrap; flex-shrink: 0; transition: background 220ms var(--ease-tide);">Request bulk pricing
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14m-5-6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;products&quot;,&quot;industries&quot;,&quot;sustainability&quot;,&quot;resources&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menu: null };
  set(menu) { this.setState({ menu }); }
  renderVals() {
    const a = this.props.active || '';
    const m = this.state.menu;
    return {
      aProducts: a === 'products', aIndustries: a === 'industries', aSustain: a === 'sustainability',
      aResources: a === 'resources', aAbout: a === 'about', aContact: a === 'contact',
      openProducts: m === 'products', openIndustries: m === 'industries', openResources: m === 'resources',
      enterProducts: () => this.set('products'), enterIndustries: () => this.set('industries'), enterResources: () => this.set('resources'),
      leaveNav: () => this.set(null),
    };
  }
}
</script>
</body>
</html>

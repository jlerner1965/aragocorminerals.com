name: Capture exact live site

on:
  push:
    branches: [main]
    paths:
      - tools/capture_live_site.py
      - .github/workflows/capture-live-site.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install capture dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Capture and verify live site
        run: python tools/capture_live_site.py

      - name: Package exact site structure
        run: |
          rm -f Aragocor_Minerals_Exact_Live_Site.zip
          cd exact-live-site
          zip -9 -r ../Aragocor_Minerals_Exact_Live_Site.zip .
          cd ..
          unzip -t Aragocor_Minerals_Exact_Live_Site.zip

      - name: Commit capture archive and manifest
        run: |
          cp exact-live-site/capture-manifest.json capture-manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Aragocor_Minerals_Exact_Live_Site.zip capture-manifest.json
          git commit -m "Add exact live-site archive"
          git push
